name: Build Android APK

on:
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

  # Gradle memory
  GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
  JAVA_TOOL_OPTIONS: "-Xmx4g -XX:MaxMetaspaceSize=1g"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------
      # Checkout
      # ---------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5

      # ---------------------------------------------
      # Free disk space FIRST
      # ---------------------------------------------
      - name: Free disk space
        run: |
          echo "Disk space before cleanup:"
          df -h

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo docker system prune -af || true

          echo "Disk space after cleanup:"
          df -h

      # ---------------------------------------------
      # Node 22
      # ---------------------------------------------
      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      # ---------------------------------------------
      # Enable Yarn
      # ---------------------------------------------
      - name: Setup Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

          echo "Node:"
          node --version

          echo "Yarn:"
          yarn --version

      # ---------------------------------------------
      # Java 17
      # ---------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------
      # Android SDK
      # ---------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "14742923"
          accept-android-sdk-licenses: true
          packages: ""

      # ---------------------------------------------
      # Show Android SDK information
      # ---------------------------------------------
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "SDK Manager:"
          sdkmanager --version

          echo ""
          echo "Installed SDK packages:"
          sdkmanager --list_installed | head -100

      # ---------------------------------------------
      # Expo + EAS
      # ---------------------------------------------
      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: yarn

      # ---------------------------------------------
      # Install project dependencies
      # ---------------------------------------------
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # ---------------------------------------------
      # Configure Gradle
      # ---------------------------------------------
      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle

          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.caching=false
          EOF

      # ---------------------------------------------
      # Verify build environment
      # ---------------------------------------------
      - name: Verify build environment
        run: |
          echo "=============================="
          echo "Node"
          node --version

          echo "=============================="
          echo "Yarn"
          yarn --version

          echo "=============================="
          echo "Java"
          java -version

          echo "=============================="
          echo "Android SDK"
          sdkmanager --version

          echo "=============================="
          echo "Gradle"
          cat ~/.gradle/gradle.properties

          echo "=============================="
          echo "Disk"
          df -h

      # ---------------------------------------------
      # Build APK
      # ---------------------------------------------
      - name: Build Android Preview APK
        run: |
          eas build \
            --platform android \
            --profile preview \
            --local \
            --non-interactive \
            --output=./app-release.apk

      # ---------------------------------------------
      # Verify APK
      # ---------------------------------------------
      - name: Verify APK
        run: |
          echo "APK:"
          ls -lh ./app-release.apk

          echo ""
          echo "File:"
          file ./app-release.apk

          echo ""
          echo "Final disk space:"
          df -h

      # ---------------------------------------------
      # Upload APK Artifact
      # ---------------------------------------------
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xacvault-test-apk
          path: ./app-release.apk
          if-no-files-found: error